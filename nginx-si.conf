# ============================================================
# GUIDE HTTPS + NGINX POUR SI GÉNIE CONSULTANT — LAN INTERNE
# ============================================================
# Fichier : nginx-si.conf
# Emplacement cible : /etc/nginx/sites-available/si-genie
# ============================================================
#
# ÉTAPE 1 — Installer nginx
# ─────────────────────────
#   sudo apt update && sudo apt install nginx -y
#
# ÉTAPE 2 — Générer un certificat auto-signé (LAN interne)
# ─────────────────────────────────────────────────────────
#   sudo mkdir -p /etc/nginx/ssl/si-genie
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/si-genie/privkey.pem \
#     -out    /etc/nginx/ssl/si-genie/fullchain.pem \
#     -subj "/C=GA/ST=Estuaire/L=Libreville/O=Genie Consultant/CN=192.168.1.133"
#
# ÉTAPE 3 — Copier ce fichier
# ────────────────────────────
#   sudo cp nginx-si.conf /etc/nginx/sites-available/si-genie
#   sudo ln -sf /etc/nginx/sites-available/si-genie /etc/nginx/sites-enabled/
#   sudo nginx -t          # vérifier la config
#   sudo systemctl reload nginx
#
# ÉTAPE 4 — Mettre à jour vite.config.js si l'IP change
# ───────────────────────────────────────────────────────
#   Remplacer 192.168.1.133 par la vraie IP du serveur.
#
# ÉTAPE 5 — Accès depuis les postes
# ───────────────────────────────────
#   https://192.168.1.133  (accepter l'avertissement certificat auto-signé)
#   Le navigateur mémorise l'exception — à faire une seule fois par poste.
#
# OPTIONNEL — Démarrage automatique nginx au boot
# ─────────────────────────────────────────────────
#   sudo systemctl enable nginx
# ============================================================

# ── Redirection HTTP → HTTPS ──────────────────────────────────
server {
    listen 80;
    server_name 192.168.1.133;
    return 301 https://$host$request_uri;
}

# ── Serveur HTTPS principal ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name 192.168.1.133;

    ssl_certificate     /etc/nginx/ssl/si-genie/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/si-genie/privkey.pem;

    # Paramètres TLS modernes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Taille maximale upload (500 Mo pour les dossiers clients)
    client_max_body_size 500M;

    # ── Frontend (vite preview sur port 4173) ─────────────────
    location / {
        proxy_pass         http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── API backend (api-proxy sur port 3001) ─────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;
    }

    # ── Health check ──────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3001;
    }

    # ── Socket.IO (WebSocket temps réel) ─────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Fichiers statiques — cache agressif ───────────────────
    location /assets/ {
        proxy_pass http://127.0.0.1:4173;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
